name: Chẩn đoán OCR & bộ dịch

# Chạy khi đẩy lên nhánh "diag". Kết quả được đẩy lên nhánh diag-app và diag-mt (tệp văn bản).
on:
  push:
    branches: [ diag ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mt-compare:
    # Kết quả so sánh bộ dịch đã có trên nhánh diag-mt; chỉ chạy lại khi gọi tay.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài thư viện
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers==4.46.3" sentencepiece sacremoses protobuf accelerate
      - name: So sánh bộ dịch
        run: python scripts/diag/mt_eval.py mt_eval.txt || true
      - name: Đẩy kết quả lên nhánh diag-mt
        if: always()
        run: |
          mkdir -p /tmp/res && cp mt_eval.txt /tmp/res/ || echo "không có kết quả" > /tmp/res/mt_eval.txt
          cd /tmp/res && git init -q && git checkout -q -b diag-mt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Kết quả so sánh bộ dịch ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-mt

  app-on-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bộ nhớ đệm mô hình Opus-MT
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/mt
          key: opus-ja-en-${{ hashFiles('scripts/models/**') }}
      - name: Tạo mô hình Opus-MT Nhật→Anh (ONNX int8)
        run: bash scripts/models/prepare_models.sh
      - name: Build APK + APK kiểm thử (đủ ABI cho trình giả lập)
        run: chmod +x gradlew && ./gradlew --no-daemon -PallAbis assembleDebug assembleDebugAndroidTest
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Chạy chẩn đoán trên trình giả lập (tự dựng, có nhật ký)
        timeout-minutes: 55
        env:
          API: "30"
        run: bash scripts/diag/emulator_manual.sh
      - name: Đẩy kết quả lên nhánh diag-app
        if: always()
        run: |
          mkdir -p res
          [ -n "$(ls -A res)" ] || echo "không có kết quả" > res/empty.txt
          cp -r res /tmp/res
          cd /tmp/res && git init -q && git checkout -q -b diag-app
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Kết quả chẩn đoán ứng dụng ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-app
