name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # để đăng APK lên mục Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Cài JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle (có cache)
        uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bộ nhớ đệm mô hình Opus-MT
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/mt
          key: opus-ja-en-${{ hashFiles('scripts/models/**') }}
      - name: Tạo mô hình Opus-MT Nhật→Anh (ONNX int8)
        run: bash scripts/models/prepare_models.sh
      - name: Cấp quyền chạy gradlew
        run: chmod +x gradlew

      - name: Chạy unit test
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle_test.log || {
            # Đưa lỗi biên dịch / test thất bại lên chú thích (annotation) để đọc được mà không cần tải log.
            grep -E "^e: |FAILED|AssertionError|Exception" gradle_test.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build APK debug
        run: ./gradlew --no-daemon assembleDebug

      # Releases không tính vào hạn mức lưu trữ Artifacts nên luôn tải được.
      # Mỗi lần build thay bản cũ bằng bản mới ở cùng tag "apk-debug-latest".
      - name: Đăng APK lên Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MangaTranslateVN-debug.apk
          TAG=apk-debug-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" MangaTranslateVN-debug.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "APK debug mới nhất (build #${{ github.run_number }})" \
            --notes "Bản debug để cài thử. Commit: ${{ github.sha }}. Nếu cài đè báo lỗi chữ ký, hãy gỡ bản cũ rồi cài lại."

      # Artifacts là đường phụ: nếu hết hạn mức lưu trữ thì bỏ qua, không làm hỏng build.
      - name: Tải APK lên Artifacts (phụ)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslateVN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Lưu báo cáo test khi lỗi
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 3
