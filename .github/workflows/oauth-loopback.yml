name: Kiểm tra callback OAuth loopback

# Chạy khi đẩy lên nhánh "diag-oauth". Kết quả đẩy lên nhánh diag-oauth-res (tệp văn bản + ảnh chụp).
on:
  push:
    branches: [ diag-oauth ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [ "34", "35" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Giải phóng dung lượng đĩa
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - name: Build APK (đủ ABI, không kèm mô hình Opus — không cần cho bài này)
        run: chmod +x gradlew && ./gradlew --no-daemon -PallAbis assembleDebug
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Chạy trên trình giả lập
        timeout-minutes: 40
        env:
          API: ${{ matrix.api }}
          RUN_SCRIPT: scripts/diag/oauth_loopback.sh
        run: bash scripts/diag/emulator_manual.sh
      - name: Đẩy kết quả
        if: always()
        run: |
          mkdir -p res && cp -r res /tmp/res
          cd /tmp/res && git init -q && git checkout -q -b diag-oauth-res-${{ matrix.api }}
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Kết quả loopback API ${{ matrix.api }} ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-oauth-res-${{ matrix.api }}
